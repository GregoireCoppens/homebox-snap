# homebox-snap on the Synology NAS, next to Homebox.
# It joins Homebox's Docker network (which Caddy is also on): it reaches Homebox as homebox:7745,
# and Caddy reaches it as homebox-snap:8000. No port is published on the NAS.

services:
  homebox-snap:
    build: .
    container_name: homebox-snap
    restart: unless-stopped
    environment:
      HOMEBOX_URL: ${HOMEBOX_URL:-http://homebox:7745}
      MAX_PHOTOS: ${MAX_PHOTOS:-12}
    networks: [homebox]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

networks:
  homebox:
    external: true
    name: ${HOMEBOX_NETWORK:-inventory_default}
